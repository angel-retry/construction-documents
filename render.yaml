services:
  - type: web
    name: construction-documents
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: APP_MODE
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
